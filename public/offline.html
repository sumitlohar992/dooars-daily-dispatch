<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#13307a" />
    <title>Offline - Dooars Khabar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #13307a;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      main { padding: 24px; }
      img { width: 96px; height: 96px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; }
      p { margin: 0; opacity: 0.8; }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        background: #69b6ff;
        color: #111;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Dooars Khabar" />
      <h1>You are offline</h1>
      <p>Previously opened stories may still be available.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
